{#- Shared look & feel for every NLS receipt / invoice print format.
    Include once at the top of a template:  {% include "slcm/templates/print/nls_receipt_style.html" %}
    Page margins are read by Frappe's PDF renderer from the `.print-format` rule. -#}
<style>
  @font-face { font-family: 'Merriweather'; font-weight: 400; font-style: normal; src: url('{{ frappe.utils.get_url() }}/assets/slcm/fonts/Merriweather-Regular.ttf') format('truetype'); }
  @font-face { font-family: 'Merriweather'; font-weight: 700; font-style: normal; src: url('{{ frappe.utils.get_url() }}/assets/slcm/fonts/Merriweather-Bold.ttf') format('truetype'); }
  @font-face { font-family: 'Merriweather'; font-weight: 400; font-style: italic; src: url('{{ frappe.utils.get_url() }}/assets/slcm/fonts/Merriweather-Italic.ttf') format('truetype'); }

  .print-format { margin-top: 6mm; margin-bottom: 6mm; margin-left: 6mm; margin-right: 6mm; padding: 0 !important; max-width: none !important; }

  .nls-doc, .nls-doc * { box-sizing: border-box; }
  .nls-doc { font-family: 'Merriweather', Georgia, serif; font-size: 12pt; color: #000; }
  .nls-doc * { margin: 0; padding: 0; }

  /* One bordered block; single-copy documents fill the page */
  .nls-copy { width: 100%; border: 1.5px solid #000; padding: 22px 30px 26px; }
  .nls-copy.is-page { min-height: 355mm; }
  .nls-copy + .nls-copy { margin-top: 10mm; }

  .nls-head { display: flex; align-items: center; border-bottom: 2px solid #000; padding-bottom: 12px; margin-bottom: 14px; }
  .nls-head img { height: 72px; width: 72px; object-fit: contain; margin-right: 16px; flex-shrink: 0; }
  .nls-inst { font-size: 16pt; font-weight: bold; color: #920C24; letter-spacing: 0.3px; text-transform: uppercase; }

  .nls-title { text-align: center; font-size: 12.5pt; font-weight: bold; margin-bottom: 14px; }

  .nls-meta { width: 100%; border-collapse: collapse; margin-bottom: 6px; }
  .nls-meta td { padding: 4px 6px; font-size: 11.5pt; vertical-align: top; color: #000; }
  .nls-meta td.lbl { width: 22%; }
  .nls-meta td.val { width: 28%; font-weight: 500; }
  .nls-boxed { font-weight: 600; border: 1px solid #000; padding: 1px 8px; }

  .nls-divider { border: none; border-top: 1px solid #000; margin: 10px 0; }

  .nls-table { width: 100%; border-collapse: collapse; margin: 12px 0; }
  .nls-table th { padding: 6px 10px; text-align: left; font-size: 11.5pt; font-weight: bold; border-top: 1px solid #000; border-bottom: 1px solid #000; }
  .nls-table td { padding: 6px 10px; border-bottom: 1px solid #000; font-size: 11.5pt; }
  .nls-table .r, .nls-table th.r { text-align: right; font-variant-numeric: tabular-nums; }
  .nls-table tfoot td { font-weight: bold; font-size: 12pt; border-top: 2px solid #000; border-bottom: none; }
  .nls-table tfoot tr + tr td { border-top: none; }
  .nls-table .muted-row td { font-style: italic; }

  .nls-words { text-align: right; font-style: italic; font-size: 11pt; margin-top: 2px; }
  .nls-section { font-size: 11.5pt; font-weight: bold; margin: 14px 0 4px; }
  .nls-note { margin-top: 16px; font-size: 11pt; }
</style>
<style>
  .nls-table th:last-child, .nls-table td:last-child { text-align: right; font-variant-numeric: tabular-nums; }
  .nls-table .scholarship-row td { font-style: italic; }
  .nls-table .net-row td { font-weight: 600; }
  .nls-cut { border-top: 1px dashed #000; margin: 8mm 0; position: relative; text-align: center; }
  .nls-cut::after { content: "✂  cut here"; position: absolute; top: -9px; left: 50%; transform: translateX(-50%); background: #fff; padding: 0 10px; font-size: 9pt; }
</style>
<style>
  /* Beat Frappe's generic print table rules */
  .print-format .nls-doc th, .print-format .nls-doc td { color: #000 !important; background: transparent !important; vertical-align: top !important; }
  .print-format .nls-doc .nls-meta td { padding: 4px 6px !important; }
  .print-format .nls-doc .nls-table th, .print-format .nls-doc .nls-table td { padding: 6px 10px !important; }
  .print-format .nls-doc .nls-copy { padding: 22px 30px 26px !important; }
  .print-format .nls-doc .nls-inst { color: #920C24 !important; }
</style>
