# Copy this file to config.ini (same folder) and fill in the blanks.
# config.ini holds passwords — keep it readable only by the account that runs the agent.

[sql]
# Biometric SQL Server (reachable from this machine on the campus network)
server = 192.168.10.10
port = 1433
database = etpdb
username = ajim
password =
table = iclock_trans_ajim
id_column = id
empcode_column = emp_code
terminal_id_column = terminal_id
terminal_alias_column = terminal_alias
punchtime_column = punch_time
# Only push punches on/after this date (YYYY-MM-DD). Leave blank for all.
fetch_from_date = 2026-07-08
device_id_zero_padded = no
add_to_device_id = 0
# Leave blank to auto-detect. Windows: "SQL Server" (built in). Linux: FreeTDS.
driver =

[live]
site_url = https://app.nls.ac.in
# API key/secret of the live-site user the agent logs in as
# (User -> Settings -> API Access -> Generate Keys).
api_key =
api_secret =

[agent]
poll_interval_seconds = 60
batch_size = 500
# Also create Attendance Log entries so the live site marks attendance.
create_attendance_log = yes
